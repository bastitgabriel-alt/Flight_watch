name: Veille billets business

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install fast-flights requests typing_extensions

      - name: Scan des prix
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANOMALY_RATIO: ${{ vars.ANOMALY_RATIO }}
          DELAY_SECONDS: ${{ vars.DELAY_SECONDS }}
        run: python flight_watch.py

      - name: Sauvegarder l'historique
        run: |
          git config user.name "flight-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "maj historique des prix"
          git push
